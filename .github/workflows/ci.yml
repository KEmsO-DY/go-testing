name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@v4
      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.4.0
      - name: Run tests
        run: go test ./...
